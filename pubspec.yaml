name: sushi_roll
description: Send files between your devices, on the same Wi-Fi or across Tailscale.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  duo_display: 1.0.1
  file_picker: ^10.0.0
  flutter_image_compress: ^2.5.1
  image: ^4.5.0
  # Windows tray + start with Windows. Pinned to the pre-rewrite releases;
  # tray_manager 0.6+/window_manager 0.6+ need Flutter 3.47+ and a new API.
  launch_at_startup: 0.5.1
  path_provider: ^2.1.4
  shared_preferences: ^2.3.0
  tray_manager: 0.5.3
  window_manager: 0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.ico
